<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Carousel slide shell</title>
  <link rel="stylesheet" href="../../brand/tokens.css" />
  <link rel="stylesheet" href="frame.css" />
</head>
<body class="slide">
  <!-- One file per slide. Reading order is this slide's lines, then the number. -->
  <main class="stage">
    <p class="kicker" data-part data-start="0">Kicker</p>
    <section class="plate" data-part data-start="0.4">
      <h2>Slide title</h2>
      <p class="slide-body">One claim already in the post.</p>
    </section>
    <p class="slide-no" data-part data-start="0.8">1 / 7</p>
  </main>
  <script src="../timeline.js"></script>
  <script src="shell-scene.js"></script>
</body>
</html>
